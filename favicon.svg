<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Geometric KT Luxury Monogram -->
  <defs>
    <linearGradient id="silverShine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
    <linearGradient id="accentBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#526BFF"/>
      <stop offset="100%" stop-color="#3B4FCC"/>
    </linearGradient>
  </defs>

  <!-- Background container -->
  <rect width="100" height="100" rx="22" fill="#10131D"/>
  <rect x="1" y="1" width="98" height="98" rx="21" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="1.5"/>

  <!-- Monogram Glyph -->
  <!-- K Stem -->
  <rect x="22" y="24" width="9" height="52" rx="4.5" fill="#FFFFFF"/>
  
  <!-- T Crossbar -->
  <rect x="42" y="24" width="36" height="8" rx="4" fill="#FFFFFF"/>
  <!-- T Stem -->
  <rect x="56" y="24" width="8" height="52" rx="4" fill="#FFFFFF"/>

  <!-- K Diagonal Arms (interlocking with T) -->
  <!-- Upper K arm -->
  <path d="M31 52 L58 26 C59.5 24.5 62 25.5 62 27.5 L62 30 C62 31.5 61 33 59.5 34.5 L39 54 Z" fill="url(#silverShine)"/>
  
  <!-- Lower K arm -->
  <path d="M42 46 L74 74 C75.5 75.5 75 78 73 78 L69 78 C67.5 78 66 77.2 65 76.2 L36 49 Z" fill="#526BFF"/>

  <!-- Refined Accent Dot -->
  <circle cx="78" cy="28" r="3.5" fill="#526BFF"/>
</svg>
