<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <defs>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="60%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="48" height="48" rx="14" fill="#05070e"/>
  <rect x="1.5" y="1.5" width="45" height="45" rx="12.5" fill="none" stroke="url(#neonGrad)" stroke-width="2.5" opacity="0.9"/>
  <text x="24" y="32" font-family="'Syne', 'Inter', sans-serif" font-weight="900" font-size="22" fill="url(#neonGrad)" text-anchor="middle" letter-spacing="-0.5" filter="url(#glow)">KT</text>
  <circle cx="36" cy="12" r="3" fill="#00e5ff"/>
</svg>
