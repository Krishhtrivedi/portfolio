<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050a0f"/>
      <stop offset="50%" stop-color="#0b161e"/>
      <stop offset="100%" stop-color="#050a0f"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(18, 30, 44, 0.85)"/>
      <stop offset="100%" stop-color="rgba(10, 18, 28, 0.95)"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(245, 158, 11, 0.05)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1280" height="800" fill="url(#bgGrad)"/>
  <rect width="1280" height="800" fill="url(#grid)"/>

  <!-- Top Browser Chrome -->
  <rect width="1280" height="44" fill="#091018" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <circle cx="28" cy="22" r="6" fill="#ef4444"/>
  <circle cx="48" cy="22" r="6" fill="#f59e0b"/>
  <circle cx="68" cy="22" r="6" fill="#10b981"/>
  <rect x="110" y="10" width="360" height="24" rx="12" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)"/>
  <text x="130" y="26" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">kisanmitra.ai-krishi.sih2025.in/diagnose</text>
  <rect x="1120" y="10" width="130" height="24" rx="12" fill="rgba(245, 158, 11, 0.15)" stroke="rgba(245, 158, 11, 0.3)"/>
  <text x="1136" y="26" fill="#f59e0b" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold">SIH 2025 NOMINEE</text>

  <!-- Main Interface Mockup -->
  <!-- Header Bar -->
  <rect x="60" y="70" width="1160" height="70" rx="16" fill="url(#cardGrad)" stroke="rgba(245, 158, 11, 0.2)" stroke-width="1"/>
  <circle cx="105" cy="105" r="22" fill="url(#amberGrad)"/>
  <text x="96" y="112" fill="#050a0f" font-family="'Syne', sans-serif" font-weight="bold" font-size="20">KM</text>
  <text x="145" y="102" fill="#ffffff" font-family="'Syne', sans-serif" font-size="18" font-weight="bold">KISANMITRA — AI KRISHI ADVISOR</text>
  <text x="145" y="120" fill="#f59e0b" font-family="'JetBrains Mono', monospace" font-size="11">MULTILINGUAL CROP PATHOLOGY &amp; VOICE SYSTEM</text>

  <rect x="990" y="88" width="200" height="34" rx="17" fill="rgba(16, 185, 129, 0.15)" stroke="#10b981" stroke-width="1"/>
  <circle cx="1010" cy="105" r="4" fill="#10b981"/>
  <text x="1022" y="109" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold">AI INFERENCE READY</text>

  <!-- Left Column: Camera / Leaf Diagnostic Scan Area -->
  <rect x="60" y="160" width="580" height="580" rx="20" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  
  <!-- Diagnostic Viewport -->
  <rect x="85" y="185" width="530" height="360" rx="14" fill="#04080e" stroke="rgba(245, 158, 11, 0.3)" stroke-width="1.5" stroke-dasharray="6,6"/>
  <!-- Simulated Crop Scan Leaf Vector -->
  <path d="M 350 220 C 230 250, 180 390, 350 490 C 520 390, 470 250, 350 220 Z" fill="rgba(16, 185, 129, 0.25)" stroke="#10b981" stroke-width="2.5"/>
  <path d="M 350 220 L 350 490" stroke="#10b981" stroke-width="2"/>
  <path d="M 350 300 Q 280 310 240 290" stroke="#10b981" stroke-width="1.5" fill="none"/>
  <path d="M 350 360 Q 270 380 230 370" stroke="#10b981" stroke-width="1.5" fill="none"/>
  <path d="M 350 330 Q 420 340 460 320" stroke="#10b981" stroke-width="1.5" fill="none"/>
  <path d="M 350 400 Q 430 420 470 410" stroke="#10b981" stroke-width="1.5" fill="none"/>

  <!-- Scanning Reticle & Blight Spot Highlight -->
  <circle cx="280" cy="330" r="32" fill="rgba(239, 68, 68, 0.25)" stroke="#ef4444" stroke-width="2"/>
  <circle cx="280" cy="330" r="6" fill="#ef4444"/>
  <line x1="280" y1="285" x2="280" y2="375" stroke="#ef4444" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="235" y1="330" x2="325" y2="330" stroke="#ef4444" stroke-width="1" stroke-dasharray="3,3"/>
  <rect x="295" y="295" width="140" height="24" rx="4" fill="rgba(239, 68, 68, 0.9)"/>
  <text x="303" y="311" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold">PATHOLOGY DETECTED</text>

  <!-- Voice Audio Waveform Bar -->
  <rect x="85" y="565" width="530" height="60" rx="12" fill="#09121c" stroke="rgba(255,255,255,0.06)"/>
  <circle cx="120" cy="595" r="16" fill="rgba(245, 158, 11, 0.2)"/>
  <path d="M 115 588 L 126 595 L 115 602 Z" fill="#f59e0b"/>
  <text x="150" y="592" fill="#ffffff" font-family="'Syne', sans-serif" font-size="12" font-weight="bold">AUDIO ADVISORY (GUJARATI &amp; HINDI)</text>
  <text x="150" y="608" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10">ખેડૂત મિત્ર: ઘઉંના પાનમાં પાનનો ગેરુ રોગ જણાય છે.</text>

  <rect x="85" y="645" width="530" height="65" rx="12" fill="rgba(245, 158, 11, 0.08)" stroke="rgba(245, 158, 11, 0.25)"/>
  <text x="105" y="670" fill="#f59e0b" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold">RECOMMENDED TREATMENT DISPATCH:</text>
  <text x="105" y="692" fill="#c9d2de" font-family="'Inter', sans-serif" font-size="11">Spray Propiconazole 25% EC @ 1ml/L water within 48 hours. Avoid nitrogen over-fertilization.</text>

  <!-- Right Column: Model Specs & AI Telemetry -->
  <rect x="660" y="160" width="560" height="580" rx="20" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  
  <text x="690" y="200" fill="#ffffff" font-family="'Syne', sans-serif" font-size="18" font-weight="bold">DIAGNOSTIC TELEMETRY MATRIX</text>
  <text x="690" y="220" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">SMART INDIA HACKATHON 2025 EVALUATION BENCHMARK</text>

  <!-- Metrics Grid -->
  <g transform="translate(690, 240)">
    <rect width="245" height="90" rx="12" fill="#09121c" stroke="rgba(245, 158, 11, 0.2)"/>
    <text x="16" y="32" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">DISEASE CLASSIFIED</text>
    <text x="16" y="60" fill="#f59e0b" font-family="'Syne', sans-serif" font-size="18" font-weight="bold">Puccinia Recondita</text>
    <text x="16" y="78" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="10">Wheat Leaf Rust (94.2% Conf)</text>

    <rect x="265" width="245" height="90" rx="12" fill="#09121c" stroke="rgba(16, 185, 129, 0.2)"/>
    <text x="281" y="32" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">INFERENCE LATENCY</text>
    <text x="281" y="60" fill="#10b981" font-family="'Syne', sans-serif" font-size="24" font-weight="bold">1.42s</text>
    <text x="281" y="78" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10">Optimized Quantized CNN</text>
  </g>

  <!-- Architecture Flow Blocks -->
  <g transform="translate(690, 350)">
    <rect width="510" height="230" rx="14" fill="#09121c" stroke="rgba(255,255,255,0.06)"/>
    <text x="20" y="30" fill="#ffffff" font-family="'Syne', sans-serif" font-size="14" font-weight="bold">END-TO-END INFERENCE PIPELINE</text>
    
    <rect x="20" y="50" width="140" height="60" rx="8" fill="rgba(245, 158, 11, 0.12)" stroke="#f59e0b" stroke-width="1"/>
    <text x="32" y="74" fill="#f59e0b" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold">1. Image Input</text>
    <text x="32" y="94" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="9">Farmer Camera Upload</text>

    <line x1="160" y1="80" x2="185" y2="80" stroke="#f59e0b" stroke-width="2"/>

    <rect x="185" y="50" width="140" height="60" rx="8" fill="rgba(16, 185, 129, 0.12)" stroke="#10b981" stroke-width="1"/>
    <text x="197" y="74" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold">2. CV Classifier</text>
    <text x="197" y="94" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="9">Pathology Detection</text>

    <line x1="325" y1="80" x2="350" y2="80" stroke="#10b981" stroke-width="2"/>

    <rect x="350" y="50" width="140" height="60" rx="8" fill="rgba(0, 229, 255, 0.12)" stroke="#00e5ff" stroke-width="1"/>
    <text x="362" y="74" fill="#00e5ff" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold">3. LLM Advisory</text>
    <text x="362" y="94" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="9">OpenAI Dose Advisory</text>

    <!-- Bottom Dialect Step -->
    <rect x="20" y="130" width="470" height="75" rx="8" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.08)"/>
    <text x="36" y="155" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold">4. Multilingual Speech Synthesis Engine</text>
    <text x="36" y="175" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="11">Translates dosage guidance and weather warnings into Gujarati &amp; Hindi audio prompts for zero-literacy accessibility in rural agricultural districts.</text>
  </g>

  <!-- Bottom Badges -->
  <g transform="translate(690, 600)">
    <rect width="160" height="36" rx="8" fill="rgba(245, 158, 11, 0.1)" stroke="rgba(245, 158, 11, 0.3)"/>
    <text x="18" y="23" fill="#f59e0b" font-family="'JetBrains Mono', monospace" font-size="11">Python Flask API</text>

    <rect x="175" width="160" height="36" rx="8" fill="rgba(16, 185, 129, 0.1)" stroke="rgba(16, 185, 129, 0.3)"/>
    <text x="195" y="23" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="11">PyTorch / ResNet</text>

    <rect x="350" width="160" height="36" rx="8" fill="rgba(0, 229, 255, 0.1)" stroke="rgba(0, 229, 255, 0.3)"/>
    <text x="375" y="23" fill="#00e5ff" font-family="'JetBrains Mono', monospace" font-size="11">OpenAI API</text>
  </g>

</svg>
