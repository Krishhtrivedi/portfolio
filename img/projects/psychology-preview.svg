<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800">
  <defs>
    <linearGradient id="psyBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04090e"/>
      <stop offset="50%" stop-color="#08141f"/>
      <stop offset="100%" stop-color="#04090e"/>
    </linearGradient>
    <linearGradient id="cyanPill" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <pattern id="dotPattern" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="15" cy="15" r="1" fill="rgba(0, 229, 255, 0.08)"/>
    </pattern>
  </defs>

  <rect width="1280" height="800" fill="url(#psyBg)"/>
  <rect width="1280" height="800" fill="url(#dotPattern)"/>

  <!-- Top Chrome -->
  <rect width="1280" height="44" fill="#081018" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <circle cx="28" cy="22" r="6" fill="#ef4444"/>
  <circle cx="48" cy="22" r="6" fill="#f59e0b"/>
  <circle cx="68" cy="22" r="6" fill="#10b981"/>
  <rect x="110" y="10" width="360" height="24" rx="12" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)"/>
  <text x="130" y="26" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">wellness-ai.assistant.internal/session</text>
  <rect x="1110" y="10" width="140" height="24" rx="12" fill="rgba(0, 229, 255, 0.15)" stroke="rgba(0, 229, 255, 0.3)"/>
  <text x="1124" y="26" fill="#00e5ff" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold">CONVERSATIONAL AI</text>

  <!-- Header -->
  <rect x="60" y="70" width="1160" height="70" rx="16" fill="rgba(10, 22, 34, 0.85)" stroke="rgba(0, 229, 255, 0.2)" stroke-width="1"/>
  <circle cx="105" cy="105" r="22" fill="url(#cyanPill)"/>
  <text x="96" y="112" fill="#05070e" font-family="'Syne', sans-serif" font-weight="bold" font-size="20">AI</text>
  <text x="145" y="102" fill="#ffffff" font-family="'Syne', sans-serif" font-size="18" font-weight="bold">AI PSYCHOLOGY &amp; MENTAL WELLNESS CHATBOT</text>
  <text x="145" y="120" fill="#00e5ff" font-family="'JetBrains Mono', monospace" font-size="11">OPENAI API · SAFETY GUARDRAILS · CONVERSATIONAL MEMORY STATE</text>

  <!-- Chat Dialog Area (Left 720px) -->
  <rect x="60" y="160" width="740" height="580" rx="20" fill="rgba(10, 22, 34, 0.85)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  
  <!-- Message 1: User -->
  <g transform="translate(100, 190)">
    <rect x="160" y="0" width="450" height="65" rx="14" fill="#152438" stroke="rgba(255,255,255,0.06)"/>
    <text x="180" y="28" fill="#ffffff" font-family="'Inter', sans-serif" font-size="12">"I'm feeling overwhelmed with upcoming semester deadlines</text>
    <text x="180" y="48" fill="#ffffff" font-family="'Inter', sans-serif" font-size="12">and project deliverables. How do I regain clarity?"</text>
    <text x="560" y="78" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="10">USER · 14:02</text>
  </g>

  <!-- Message 2: AI Assistant Response -->
  <g transform="translate(100, 285)">
    <circle cx="20" cy="20" r="16" fill="url(#cyanPill)"/>
    <text x="12" y="25" fill="#05070e" font-family="'Syne', sans-serif" font-size="12" font-weight="bold">KT</text>
    <rect x="50" y="0" width="560" height="150" rx="14" fill="#08121d" stroke="rgba(0, 229, 255, 0.25)"/>
    <text x="70" y="30" fill="#00e5ff" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold">AI MENTAL WELLNESS COMPANION</text>
    <text x="70" y="55" fill="#c9d2de" font-family="'Inter', sans-serif" font-size="12" leading="1.6">
      It is completely natural to experience stress when critical milestones converge.
    </text>
    <text x="70" y="78" fill="#c9d2de" font-family="'Inter', sans-serif" font-size="12">
      Let's practice the 3-Step Cognitive De-escalation exercise:
    </text>
    <text x="70" y="102" fill="#10b981" font-family="'Inter', sans-serif" font-size="12">
      1. Identify the single highest-impact task for the next 45 minutes.
    </text>
    <text x="70" y="124" fill="#10b981" font-family="'Inter', sans-serif" font-size="12">
      2. Temporarily park all other deadlines on an external capture sheet.
    </text>
    <text x="50" y="165" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="10">AI AGENT · 14:02 (0.84s LATENCY)</text>
  </g>

  <!-- Prompt Input Mockup -->
  <rect x="90" y="660" width="680" height="55" rx="14" fill="#08101a" stroke="rgba(255,255,255,0.1)"/>
  <text x="115" y="693" fill="#64748b" font-family="'Inter', sans-serif" font-size="12">Type a reflective inquiry or mental check-in...</text>
  <rect x="670" y="670" width="85" height="35" rx="8" fill="url(#cyanPill)"/>
  <text x="696" y="692" fill="#05070e" font-family="'Syne', sans-serif" font-size="11" font-weight="bold">SEND</text>

  <!-- Right Column: Safety Guardrails & Model Internals -->
  <rect x="830" y="160" width="390" height="580" rx="20" fill="rgba(10, 22, 34, 0.85)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  
  <text x="860" y="200" fill="#ffffff" font-family="'Syne', sans-serif" font-size="18" font-weight="bold">SAFETY &amp; NLP TELEMETRY</text>
  <text x="860" y="220" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11">ETHICAL GUARDRAILS &amp; SENTIMENT METRICS</text>

  <!-- Sentiment Meter -->
  <g transform="translate(860, 250)">
    <rect width="330" height="80" rx="10" fill="#08121d" stroke="rgba(255,255,255,0.06)"/>
    <text x="15" y="25" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10">DETECTED EMOTIONAL POLARITY</text>
    <text x="15" y="50" fill="#f59e0b" font-family="'Syne', sans-serif" font-size="16" font-weight="bold">Elevated Cognitive Load (0.72)</text>
    <rect x="15" y="60" width="300" height="6" rx="3" fill="#1e293b"/>
    <rect x="15" y="60" width="216" height="6" rx="3" fill="#f59e0b"/>
  </g>

  <!-- Safety Boundary Checks -->
  <g transform="translate(860, 350)">
    <rect width="330" height="210" rx="12" fill="#08121d" stroke="rgba(255,255,255,0.06)"/>
    <text x="15" y="28" fill="#ffffff" font-family="'Syne', sans-serif" font-size="13" font-weight="bold">ACTIVE ETHICAL GUARDRAILS</text>
    
    <g transform="translate(15, 45)">
      <circle cx="8" cy="8" r="6" fill="#10b981"/>
      <text x="24" y="12" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="11">Non-Clinical Boundary Filter: PASSED</text>
    </g>
    <g transform="translate(15, 80)">
      <circle cx="8" cy="8" r="6" fill="#10b981"/>
      <text x="24" y="12" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="11">Self-Harm Escalation Trap: ACTIVE</text>
    </g>
    <g transform="translate(15, 115)">
      <circle cx="8" cy="8" r="6" fill="#10b981"/>
      <text x="24" y="12" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="11">Zero Medical Advice Enforced: 100%</text>
    </g>
    <g transform="translate(15, 150)">
      <circle cx="8" cy="8" r="6" fill="#10b981"/>
      <text x="24" y="12" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="11">Context Retention Memory: 8 TURNS</text>
    </g>
  </g>

  <!-- Tech Badges -->
  <g transform="translate(860, 590)">
    <rect width="100" height="32" rx="6" fill="rgba(0, 229, 255, 0.1)" stroke="#00e5ff"/>
    <text x="18" y="21" fill="#00e5ff" font-family="'JetBrains Mono', monospace" font-size="11">Python NLP</text>

    <rect x="115" width="100" height="32" rx="6" fill="rgba(16, 185, 129, 0.1)" stroke="#10b981"/>
    <text x="128" y="21" fill="#10b981" font-family="'JetBrains Mono', monospace" font-size="11">OpenAI API</text>

    <rect x="230" width="100" height="32" rx="6" fill="rgba(139, 92, 246, 0.1)" stroke="#8b5cf6"/>
    <text x="246" y="21" fill="#8b5cf6" font-family="'JetBrains Mono', monospace" font-size="11">Prompt Sec</text>
  </g>
</svg>
