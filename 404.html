  <!-- Immediate Zero-FOUC Theme & Session Preloader Initializer -->
  <script>
    (function() {
      try {
        let theme = localStorage.getItem('kt_theme');
        if (!theme) {
          const prefersLight = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
          theme = prefersLight ? 'light' : 'dark';
        }
        document.documentElement.setAttribute('data-theme', theme);
        if (theme === 'dark') {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
        if (sessionStorage.getItem('kt_visited') === 'true') {
          const s = document.createElement('style');
          s.id = 'preloader-skip-style';
          s.textContent = '#pagePreloader { display: none !important; }';
          document.head.appendChild(s);
        }
      } catch (e) {}
    })();
  </script>
